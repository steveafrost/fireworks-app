# XcodeGen spec. The .xcodeproj is generated from this file and never committed,
# so every change to the project (a new file, a new target, a signing setting) is
# a reviewable line in git instead of an opaque pbxproj diff.
#
#   xcodegen generate && open Fireworks.xcodeproj
name: Fireworks
options:
  bundleIdPrefix: com.whitebox
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 4QJ25Y85MX
    # Local builds are ad-hoc signed: they run on this Mac and keep a stable
    # bundle id (which notifications and the Keychain both require) without
    # needing a provisioning profile. Release builds override this with the
    # Developer ID identity — see RELEASE.md.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GENERATE_INFOPLIST_FILE: NO

packages:
  FireworksCore:
    path: Core

targets:
  # ---------------------------------------------------------------- macOS app
  Fireworks:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: Mac
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: FireworksCore
      - target: FireworksWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whitebox.fireworks
        PRODUCT_NAME: Fireworks
        INFOPLIST_FILE: Mac/Info.plist
        # A menu-bar app: no Dock icon, no main window, no app switcher entry.
        # `LSUIElement` is set in Info.plist; the popover is the whole UI.
        ENABLE_APP_SANDBOX: NO

  # ------------------------------------------------------ macOS widget plugin
  FireworksWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Shared
      - path: Widgets
    dependencies:
      - package: FireworksCore
        product: FireworksCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whitebox.fireworks.widgets
        PRODUCT_NAME: FireworksWidgets
        INFOPLIST_FILE: Widgets/Mac/Info.plist
        ENABLE_APP_SANDBOX: NO
        SKIP_INSTALL: YES

  # ------------------------------------------------------------------ iOS app
  FireworksiOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: FireworksCore
      - target: FireworksiOSWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whitebox.fireworks.ios
        PRODUCT_NAME: Fireworks
        INFOPLIST_FILE: iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_APP_SANDBOX: YES

  # ------------------------------------------------------- iOS widget plugin
  FireworksiOSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: Widgets
    dependencies:
      - package: FireworksCore
        product: FireworksCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whitebox.fireworks.ios.widgets
        PRODUCT_NAME: FireworksiOSWidgets
        INFOPLIST_FILE: Widgets/iOS/Info.plist
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
