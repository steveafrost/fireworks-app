# XcodeGen spec. The .xcodeproj is generated from this file and never committed,
# so every change to the project (a new file, a new target, a signing setting) is
# a reviewable line in git instead of an opaque pbxproj diff.
#
#   xcodegen generate && open Fireworks.xcodeproj
#
# Info.plists live in Config/, deliberately outside the source trees: a plist
# inside a folder that is a target's `sources` is also copied as a resource, and
# two targets sharing that folder then produce the same file twice — which
# fails the build with "Multiple commands produce ... Info.plist".
name: Fireworks
options:
  bundleIdPrefix: com.whitebox
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 4QJ25Y85MX
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GENERATE_INFOPLIST_FILE: NO

  # Two signing modes, because they answer different questions.
  #
  #   Debug   — ad-hoc, no entitlements, no provisioning profile. Builds and runs
  #             on any Mac with no Apple account, which is how the app is being
  #             developed and how it runs on this machine today. The bundle id is
  #             still stable, which is all notifications and the Keychain need.
  #   Release — a real identity carrying the App Group entitlement. This
  #             authorizes the shared container the widget reads. Plugin
  #             registration alone is not proof that a widget can draw live data.
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
    Release:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"

packages:
  FireworksCore:
    path: Core
  # Sparkle, for updates outside the App Store. Only the macOS target links it:
  # the iOS target is App-Store-shaped and gets updates from there instead.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

targets:
  # ---------------------------------------------------------------- macOS app
  Fireworks:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: Mac
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: FireworksCore
      - package: Sparkle
      - target: FireworksWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whitebox.fireworks
        PRODUCT_NAME: Fireworks
        INFOPLIST_FILE: Mac/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # A menu-bar app: no Dock icon, no main window, no app switcher entry.
        # `LSUIElement` is set in Info.plist; the popover is the whole UI.
        ENABLE_APP_SANDBOX: NO
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Mac/Fireworks.entitlements

  # ------------------------------------------------------ macOS widget plugin
  FireworksWidgets:
    type: app-extension
    platform: macOS
    sources:
      # The app icon belongs to the app, not the extension.
      - path: Shared
        excludes:
          # The app icon belongs to the app, and the offscreen render harness is a
          # macOS-only CLI path neither extension runs. An AppKit import inside an
          # extension target also trips dependency scanning: "Unable to resolve
          # module dependency: 'AppKit' (in target 'FireworksiOSWidgets')".
          - "Assets/**"
          - "UISnapshot.swift"
      - path: Widgets
    dependencies:
      - package: FireworksCore
        product: FireworksCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whitebox.fireworks.widgets
        PRODUCT_NAME: FireworksWidgets
        INFOPLIST_FILE: Config/Widget-macOS-Info.plist
        # Extensions must be sandboxed, which is why they read the App Group.
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Widgets/FireworksWidgets.entitlements

  # ------------------------------------------------------------------ iOS app
  FireworksiOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: FireworksCore
      - target: FireworksiOSWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whitebox.fireworks.ios
        PRODUCT_NAME: Fireworks
        INFOPLIST_FILE: iOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_APP_SANDBOX: YES
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: iOS/Fireworks.entitlements

  # ------------------------------------------------------- iOS widget plugin
  FireworksiOSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
        excludes:
          # The app icon belongs to the app, and the offscreen render harness is a
          # macOS-only CLI path neither extension runs. An AppKit import inside an
          # extension target also trips dependency scanning: "Unable to resolve
          # module dependency: 'AppKit' (in target 'FireworksiOSWidgets')".
          - "Assets/**"
          - "UISnapshot.swift"
      - path: Widgets
    dependencies:
      - package: FireworksCore
        product: FireworksCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whitebox.fireworks.ios.widgets
        PRODUCT_NAME: FireworksiOSWidgets
        INFOPLIST_FILE: Config/Widget-iOS-Info.plist
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Widgets/FireworksWidgets.entitlements

  # ---------------------------------------------- iOS UI tests (screenshots)
  # A UI test rather than a unit test, for two reasons: App Store screenshots have to
  # come from the app running on a real device surface, and the one promise the demo
  # makes — that it says the figures are not the account's — is a claim about what is
  # drawn, which only this can check. The app is driven with DEBUG-only launch
  # arguments (`--demo`, `--render-ui-sample`), so a shipped build has neither path.
  FireworksiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iOSUITests
    dependencies:
      - target: FireworksiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whitebox.fireworks.ios.uitests
        TEST_TARGET_NAME: FireworksiOS
        GENERATE_INFOPLIST_FILE: YES

# Explicit schemes. Adding a `schemes:` key stops XcodeGen generating one per target, so
# every scheme the release script drives has to be named here or a release fails with
# "does not contain a scheme named FireworksiOS" — which is how this block came to exist.
# `Fireworks` and `FireworksiOS` are the two `Tools/release-dmg.sh` archives and exports;
# the UI test scheme is the reason any of this is spelled out.
schemes:
  Fireworks:
    build:
      targets:
        Fireworks: all
  FireworksiOS:
    build:
      targets:
        FireworksiOS: all
    test:
      targets:
        - FireworksiOSUITests
  FireworksiOSUITests:
    build:
      targets:
        FireworksiOS: all
        FireworksiOSUITests: [test]
    test:
      targets:
        - FireworksiOSUITests
